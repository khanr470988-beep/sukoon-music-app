<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sukoon Music</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
  font-family:Arial,sans-serif;
}

body{
  background:#09070d;
  color:white;
  padding-bottom:110px;
}

header{
  padding:22px 18px 10px;
}

.logo{
  font-size:28px;
  font-weight:bold;
  color:#b56cff;
}

.subtitle{
  color:#aaa;
  margin-top:5px;
}

.search{
  margin:15px 18px;
}

.search input{
  width:100%;
  padding:14px 18px;
  border:0;
  outline:none;
  border-radius:30px;
  background:#211b2b;
  color:white;
  font-size:15px;
}

.hero{
  margin:18px;
  padding:25px;
  border-radius:22px;
  background:linear-gradient(135deg,#6d2cff,#b84cff);
}

.hero h1{
  font-size:27px;
}

.hero p{
  margin-top:8px;
  color:#eee;
}

.section{
  padding:8px 18px;
}

.section-title{
  font-size:21px;
  font-weight:bold;
  margin:15px 0;
}

.cards{
  display:flex;
  gap:14px;
  overflow-x:auto;
}

.card{
  min-width:145px;
  background:#17131e;
  padding:12px;
  border-radius:16px;
}

.cover{
  height:120px;
  border-radius:12px;
  background:linear-gradient(135deg,#762cff,#291044);
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:40px;
}

.card h3{
  margin-top:10px;
  font-size:15px;
}

.card p{
  margin-top:5px;
  color:#999;
  font-size:12px;
}

.play-small{
  margin-top:10px;
  width:100%;
  border:0;
  padding:9px;
  border-radius:20px;
  background:#9d4dff;
  color:white;
}

.add-box{
  margin:18px;
  padding:18px;
  border:1px dashed #8f4cff;
  border-radius:18px;
  text-align:center;
}

.add-btn{
  display:inline-block;
  background:#9d4dff;
  color:white;
  padding:12px 22px;
  border-radius:25px;
  font-weight:bold;
  cursor:pointer;
}

#songFile{
  display:none;
}

.empty{
  color:#888;
  text-align:center;
  padding:25px 10px;
}

.player{
  position:fixed;
  left:10px;
  right:10px;
  bottom:60px;
  background:#21172c;
  border:1px solid #382647;
  border-radius:20px;
  padding:13px;
  z-index:10;
  box-shadow:0 5px 30px #000;
}

.song-info{
  display:flex;
  justify-content:space-between;
  align-items:center;
}

.song-title{
  font-weight:bold;
}

.song-artist{
  color:#aaa;
  font-size:12px;
  margin-top:4px;
}

.progress{
  width:100%;
  margin:10px 0;
}

.controls{
  display:flex;
  justify-content:center;
  align-items:center;
  gap:22px;
}

.controls button{
  border:0;
  background:transparent;
  color:white;
  font-size:22px;
}

.play-btn{
  width:48px;
  height:48px;
  border-radius:50%;
  background:#a64cff !important;
}

.bottom-nav{
  position:fixed;
  left:0;
  right:0;
  bottom:0;
  height:60px;
  background:#100c15;
  display:flex;
  justify-content:space-around;
  align-items:center;
  z-index:20;
}

.bottom-nav div{
  color:#aaa;
  font-size:12px;
  text-align:center;
}

.bottom-nav .active{
  color:#b45cff;
}

.no-results{
  text-align:center;
  color:#888;
  padding:20px;
}
</style>
</head>

<body>

<header>
  <div class="logo">Sukoon 🎵</div>
  <div class="subtitle">Music for your peace</div>
</header>

<div class="search">
  <input
    type="text"
    id="searchInput"
    placeholder="Search songs..."
    oninput="searchSongs()"
  >
</div>

<div class="hero">
  <h1>Chill Vibes</h1>
  <p>Relax, listen and enjoy your Sukoon.</p>
</div>

<!-- ADD SONG -->
<div class="add-box">
  <div style="font-size:18px;margin-bottom:10px;">
    Add your own music 🎶
  </div>

  <label for="songFile" class="add-btn">
    ＋ Add Song
  </label>

  <input
    type="file"
    id="songFile"
    accept="audio/*"
    onchange="addSong(event)"
  >
</div>

<section class="section">
  <div class="section-title">My Songs</div>

  <div class="cards" id="songList">
    <div class="empty" id="emptyMessage">
      अभी कोई song नहीं है.<br>
      ऊपर <b>＋ Add Song</b> दबाकर MP3 जोड़ें।
    </div>
  </div>
</section>

<!-- PLAYER -->
<div class="player">

  <div class="song-info">
    <div>
      <div class="song-title" id="songTitle">
        No Song
      </div>

      <div class="song-artist" id="songArtist">
        Add a song to start
      </div>
    </div>
  </div>

  <input
    type="range"
    class="progress"
    id="progress"
    value="0"
    min="0"
    max="100"
  >

  <div class="controls">

    <button onclick="rewind()">
      ↶
    </button>

    <button
      class="play-btn"
      id="playBtn"
      onclick="toggleMusic()"
    >
      ▶
    </button>

    <button onclick="forward()">
      ↷
    </button>

  </div>

</div>

<div class="bottom-nav">
  <div class="active">⌂<br>Home</div>
  <div>🔍<br>Search</div>
  <div>♥<br>Library</div>
</div>

<audio id="music" preload="metadata"></audio>

<script>

let songs = [];

let currentSong = null;

const music = document.getElementById("music");
const playBtn = document.getElementById("playBtn");
const songTitle = document.getElementById("songTitle");
const songArtist = document.getElementById("songArtist");
const progress = document.getElementById("progress");
const songList = document.getElementById("songList");
const emptyMessage = document.getElementById("emptyMessage");


/* ADD SONG */

function addSong(event){

  const file = event.target.files[0];

  if(!file){
    return;
  }

  const song = {
    title: file.name.replace(/\.[^/.]+$/, ""),
    artist: "My Song",
    file: file,
    url: URL.createObjectURL(file)
  };

  songs.push(song);

  emptyMessage.style.display = "none";

  renderSongs();

  playSong(song);

  event.target.value = "";
}


/* SHOW SONGS */

function renderSongs(){

  songList.innerHTML = "";

  if(songs.length === 0){

    songList.innerHTML = `
      <div class="empty">
        अभी कोई song नहीं है.
      </div>
    `;

    return;
  }

  songs.forEach((song,index)=>{

    const card = document.createElement("div");

    card.className = "card";

    card.innerHTML = `
      <div class="cover">🎵</div>

      <h3>${escapeHtml(song.title)}</h3>

      <p>${escapeHtml(song.artist)}</p>

      <button class="play-small">
        ▶ Play
      </button>
    `;

    card.querySelector("button").onclick = function(){
      playSong(song);
    };

    songList.appendChild(card);

  });
}


/* PLAY SONG */

function playSong(song){

  currentSong = song;

  music.src = song.url;

  songTitle.textContent = song.title;

  songArtist.textContent = song.artist;

  music.load();

  music.play()
    .then(function(){

      playBtn.innerHTML = "⏸";

    })
    .catch(function(error){

      console.log(error);

      playBtn.innerHTML = "▶";

    });
}


/* PLAY / PAUSE */

function toggleMusic(){

  if(!currentSong){

    alert("पहले ＋ Add Song से कोई MP3 जोड़ें।");

    return;
  }

  if(music.paused){

    music.play()
      .then(function(){
        playBtn.innerHTML = "⏸";
      });

  }else{

    music.pause();

    playBtn.innerHTML = "▶";

  }
}


/* REWIND */

function rewind(){

  if(!currentSong) return;

  music.currentTime = Math.max(
    0,
    music.currentTime - 10
  );
}


/* FORWARD */

function forward(){

  if(!currentSong) return;

  music.currentTime = Math.min(
    music.duration || 0,
    music.currentTime + 10
  );
}


/* PROGRESS */

music.addEventListener("timeupdate",function(){

  if(music.duration){

    progress.value =
      (music.currentTime / music.duration) * 100;

  }

});


progress.addEventListener("input",function(){

  if(music.duration){

    music.currentTime =
      (progress.value / 100) * music.duration;

  }

});


/* SONG ENDED */

music.addEventListener("ended",function(){

  playBtn.innerHTML = "▶";

});


/* SEARCH */

function searchSongs(){

  const query =
    document.getElementById("searchInput")
    .value
    .toLowerCase()
    .trim();

  const cards =
    document.querySelectorAll(".card");

  if(!query){

    cards.forEach(card=>{
      card.style.display = "block";
    });

    return;
  }

  let found = false;

  songs.forEach((song,index)=>{

    const match =
      song.title.toLowerCase().includes(query) ||
      song.artist.toLowerCase().includes(query);

    if(cards[index]){

      cards[index].style.display =
        match ? "block" : "none";

    }

    if(match){
      found = true;
    }

  });

}


/* SECURITY */

function escapeHtml(text){

  const div = document.createElement("div");

  div.textContent = text;

  return div.innerHTML;

}

</script>

</body>
</html>
